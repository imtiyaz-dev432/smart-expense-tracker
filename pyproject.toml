[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = [
    "BLE001",    # except Exception — Flask routes + Redis fallback mein intentional
    "RUF012",    # mutable class default — Flask Config pattern
]

[tool.ruff.lint.isort]
known-first-party = ["config", "models", "utils", "routes", "schemas", "test"]